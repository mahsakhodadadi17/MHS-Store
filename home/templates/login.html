{% load static %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ورود</title>


<link rel="stylesheet" href="{% static 'css/login.css' %}">

</head>


<body>


<div class="login-container">

<div class="login-box">


<div class="logo">
MHS
</div>



<h1>
ورود به حساب
</h1>



<form method="POST" action="{% url 'login' %}">


    {% csrf_token %}



    {% if error %}

        <p>
         {{ error }}
        </p>

    {% endif %}


    <input 
    type="text"
    name="username"
    placeholder="نام کاربری">



    <input
    type="password"
    name="password"
    placeholder="رمز عبور">



    <button type="submit">
        ورود
    </button>


</form>



<p>

حساب ندارید؟

<a href="{% url 'register' %}">
ثبت نام
</a>


</p>



</div>



</div>



<script src="{% static 'js/login.js' %}"></script>


</body>

</html>
