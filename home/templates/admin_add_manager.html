{% extends "admin_base.html" %}

{% block title %}افزودن مدیر{% endblock %}

{% block page_title %}
افزودن مدیر جدید
{% endblock %}

{% block breadcrumb %}
مدیریت مدیران / افزودن مدیر
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow">

        <div class="card-header">

            <h3 class="card-title">

                <i class="fas fa-user-plus text-success"></i>

                افزودن مدیر جدید

            </h3>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="card-body">

                <div class="row">

                    <div class="col-md-6">

                        <div class="form-group">

                            <label>نام کاربری</label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required>

                        </div>

                    </div>

                    <div class="col-md-6">

                        <div class="form-group">

                            <label>ایمیل</label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required>

                        </div>

                    </div>

                    <div class="col-md-6">

                        <div class="form-group">

                            <label>رمز عبور</label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required>

                        </div>

                    </div>

                    <div class="col-md-6">

                        <div class="form-group">

                            <label>نوع حساب</label>

                            <select
                                name="role"
                                class="form-control">

                                <option value="admin">
                                    مدیر
                                </option>

                                <option value="superadmin">
                                    سوپر ادمین
                                </option>

                            </select>

                        </div>

                    </div>

                </div>

            </div>

            <div class="card-footer">

                <button class="btn btn-success">

                    <i class="fas fa-save"></i>

                    ثبت مدیر

                </button>

                <a href="{% url 'admin_managers' %}" class="btn btn-secondary">

                    بازگشت

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
