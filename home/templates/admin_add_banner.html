{% extends "admin_base.html" %}


{% block title %}
افزودن بنر
{% endblock %}


{% block page_title %}
افزودن بنر جدید
{% endblock %}



{% block content %}


<div class="card shadow">


<div class="card-body">


<form method="POST" enctype="multipart/form-data">


{% csrf_token %}



<div class="form-group">

<label>
عنوان (اختیاری)
</label>

<input 
type="text"
name="title"
class="form-control">

</div>



<div class="form-group">

<label>
نوع بنر
</label>


<select name="banner_type" class="form-control">


<option value="slider">

اسلایدر اصلی

</option>


<option value="collection">

کالکشن

</option>


</select>


</div>
<div class="form-group">

<label>
بخش
</label>


<select name="section" class="form-control">

<option value="shoes">
کفش
</option>


<option value="perfume">
عطر و ادکلن
</option>


</select>

</div>

<div class="form-group">

<label>
چیدمان اسلاید
</label>

<select name="layout" class="form-control">

<option value="single">
اسلاید بزرگ
</option>


<option value="double">
اسلاید دو بخشی
</option>


</select>

</div>




<div class="form-group">

<label>
تصویر
</label>


<input 
type="file"
name="image"
class="form-control">


</div>



<div class="form-group">

<label>
ویدیو
</label>


<input 
type="file"
name="video"
class="form-control">


</div>
<div class="form-group">

<label>
تصویر دوم (برای اسلاید دو بخشی)
</label>

<input 
type="file"
name="second_image"
class="form-control">

</div>



<div class="form-group">

<label>
ویدیوی دوم (برای اسلاید دو بخشی)
</label>

<input 
type="file"
name="second_video"
class="form-control">

</div>



<div class="form-group">

<label>
لینک (اختیاری)
</label>


<input 
type="text"
name="link"
class="form-control">


</div>



<div class="form-group">

<label>
ترتیب نمایش
</label>


<input 
type="number"
name="order"
value="0"
class="form-control">


</div>



<div class="form-check">

<input 
type="checkbox"
name="active"
checked>


<label>

فعال باشد

</label>


</div>


<br>


<button class="btn btn-success">

<i class="fas fa-save"></i>

ذخیره بنر

</button>


</form>


</div>


</div>


{% endblock %}
