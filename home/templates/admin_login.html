{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود مدیر</title>

    <link rel="stylesheet" href="{% static 'css/admin_login.css' %}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="login-card">

    <div class="logo">
        <i class="fas fa-user-shield"></i>
    </div>

    <h2>پنل مدیریت</h2>

    <p class="subtitle">
        برای ادامه وارد حساب مدیر شوید
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="input-box">
            <i class="fas fa-user"></i>

            <input
                type="text"
                name="username"
                placeholder="نام کاربری"
                required>
        </div>

        <div class="input-box">

            <i class="fas fa-lock"></i>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="رمز عبور"
                required>

            <i class="fas fa-eye eye" id="eye"></i>

        </div>

        <button type="submit">
            ورود به پنل مدیریت
        </button>

    </form>

    <div class="footer">
        MHS STORE Admin Panel
    </div>

</div>

<script src="{% static 'js/admin_login.js' %}"></script>

</body>
</html>
