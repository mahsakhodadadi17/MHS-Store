{% load static %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>افزودن آدرس</title>

    <link rel="stylesheet" href="{% static 'css/add_address.css' %}">
</head>

<body>

<div class="address-container">

    <h1>افزودن آدرس جدید</h1>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>نام و نام خانوادگی</label>
            <input type="text" name="full_name" required>
        </div>

        <div class="form-group">
            <label>شماره موبایل</label>
            <input type="text" name="phone" required>
        </div>

        <div class="form-group">
            <label>استان</label>
            <input type="text" name="province">
        </div>

        <div class="form-group">
            <label>شهر</label>
            <input type="text" name="city" required>
        </div>

        <div class="form-group">
            <label>کد پستی</label>
            <input type="text" name="postal_code">
        </div>

        <div class="form-group">
            <label>خیابان</label>
            <input type="text" name="street">
        </div>

        <div class="form-group">
            <label>کوچه</label>
            <input type="text" name="alley">
        </div>

        <div class="form-group">
            <label>پلاک</label>
            <input type="text" name="plaque">
        </div>

        <div class="form-group">
            <label>واحد (اختیاری)</label>
            <input type="text" name="unit">
        </div>

        <div class="form-group">
            <label>توضیحات برای پیک (اختیاری)</label>
            <textarea name="description"></textarea>
        </div>

        <button class="save-address">
            ذخیره آدرس
        </button>

    </form>

</div>

</body>
</html>
